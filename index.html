<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple To-Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <!-- Form for adding a new task -->
    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input id="task-input" type="text" placeholder="What needs to be done?" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <!-- Tasks are rendered here by script.js -->
    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty">No tasks yet — add one above!</p>
    <p id="counter" class="counter"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
